name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev/laiyongjie]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}-{1}', github.run_id, github.run_attempt) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      contracts: ${{ steps.plan.outputs.contracts }}
      frontend: ${{ steps.plan.outputs.frontend }}
      desktop: ${{ steps.plan.outputs.desktop }}
      backend: ${{ steps.plan.outputs.backend }}
      windows_native: ${{ steps.plan.outputs.windows_native }}
      docs_spec: ${{ steps.plan.outputs.docs_spec }}
    steps:
      - name: Checkout complete comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Classify explicit base and head commits
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          event_force_full=false
          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              ;;
            merge_group)
              base_sha="$MERGE_GROUP_BASE_SHA"
              head_sha="$MERGE_GROUP_HEAD_SHA"
              ;;
            push)
              base_sha="$PUSH_BASE_SHA"
              head_sha="$PUSH_HEAD_SHA"
              event_force_full=true
              ;;
            workflow_dispatch)
              base_sha="$PUSH_HEAD_SHA"
              head_sha="$PUSH_HEAD_SHA"
              event_force_full=true
              ;;
            *)
              echo "Unsupported CI event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [[ "$base_sha" =~ ^0{40}$ ]]; then
            base_sha="$head_sha"
          fi

          classifier_status=0
          node scripts/ci/classify-changes.mjs \
            --base "$base_sha" --head "$head_sha" --json \
            > classifier-report.json || classifier_status=$?
          [ -s classifier-report.json ] || {
            echo 'Change classifier did not emit a JSON report' >&2
            exit 1
          }
          jq . classifier-report.json
          [ "$classifier_status" -eq 0 ] || exit "$classifier_status"

          jq --argjson eventForceFull "$event_force_full" '
            if $eventForceFull then
              .forceFull = true | .domains |= with_entries(.value = true)
            else
              .
            end
          ' classifier-report.json > ci-plan.json
          plan="$(jq -c . ci-plan.json)"
          {
            printf 'plan=%s\n' "$plan"
            printf 'contracts=%s\n' "$(jq -r '.domains.contracts' ci-plan.json)"
            printf 'frontend=%s\n' "$(jq -r '.domains.frontend' ci-plan.json)"
            printf 'desktop=%s\n' "$(jq -r '.domains.desktop' ci-plan.json)"
            printf 'backend=%s\n' "$(jq -r '.domains.backend' ci-plan.json)"
            printf 'windows_native=%s\n' "$(jq -r '.domains.windowsNative' ci-plan.json)"
            printf 'docs_spec=%s\n' "$(jq -r '.domains.docsSpec' ci-plan.json)"
          } >> "$GITHUB_OUTPUT"

  contracts:
    name: Repository Contracts
    needs: changes
    if: needs.changes.result == 'success' && (needs.changes.outputs.contracts == 'true' || needs.changes.outputs.docs_spec == 'true')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Resolve locked toolchain facts
        id: toolchain-facts
        run: node scripts/ci/verify-toolchain.mjs --emit-github-output

      - name: Setup uv and managed Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ steps.toolchain-facts.outputs.uv-version }}
          python-version: ${{ steps.toolchain-facts.outputs.python-version }}
          enable-cache: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Synchronize locked Python environment
        run: uv sync --locked

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify active toolchains
        run: node scripts/ci/verify-toolchain.mjs --tools node,pnpm,rust,uv,python

      - name: Run repository and release contracts
        run: node scripts/tasks/release-check.mjs --ci

  frontend:
    name: Frontend Checks
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Resolve locked toolchain facts
        id: toolchain-facts
        run: node scripts/ci/verify-toolchain.mjs --emit-github-output

      - name: Setup uv and managed Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ steps.toolchain-facts.outputs.uv-version }}
          python-version: ${{ steps.toolchain-facts.outputs.python-version }}
          enable-cache: false

      - name: Synchronize locked Python environment
        run: uv sync --locked

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify active toolchains
        run: node scripts/ci/verify-toolchain.mjs --tools node,pnpm,uv,python

      - name: Verify application version contract
        run: pnpm run version:check

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Unit tests
        # These four host-integration suites exercise the real local mise API.
        # Their pure Node contracts still run above; the real mise boundary is
        # owned by the canonical local check rather than GitHub Actions.
        run: |
          pnpm test:unit \
            --exclude tests/developmentEnvironment.test.ts \
            --exclude tests/miseTaskContract.test.ts \
            --exclude tests/systemCheck.test.ts \
            --exclude tests/taskDocs.test.ts

      - name: Locale key parity
        run: pnpm test:i18n

  desktop-acceptance-contract:
    name: Desktop Acceptance Contract
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify active toolchains
        run: node scripts/ci/verify-toolchain.mjs --tools node,pnpm

      - name: Verify mock-only desktop acceptance contract
        run: pnpm test:desktop:mock

      - name: Verify native Fetch through MSW and Tauri mock
        run: pnpm test:native-fetch

      - name: Verify visual baseline capture policy
        run: pnpm test:desktop:visual:preflight

  backend-linux:
    name: Backend Checks (Linux)
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Verify active toolchains
        run: node scripts/ci/verify-toolchain.mjs --tools node,pnpm,rust

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Create frontend dist placeholder
        run: mkdir -p dist

      - name: Check Rust formatting
        run: cargo fmt --all --check --manifest-path src-tauri/Cargo.toml

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets --locked --manifest-path src-tauri/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --locked --manifest-path src-tauri/Cargo.toml

  backend-windows:
    name: Backend Checks (Windows)
    needs: changes
    if: needs.changes.result == 'success' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.windows_native == 'true')
    runs-on: windows-2025
    env:
      FYAGENT_WINDOWS_MANIFEST: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Verify active toolchains
        run: node scripts/ci/verify-toolchain.mjs --tools node,pnpm,rust

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets --locked --manifest-path src-tauri/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --locked --manifest-path src-tauri/Cargo.toml

  windows-native-contracts:
    name: Windows Native Contracts (${{ matrix.architecture }})
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.windows_native == 'true'
    timeout-minutes: 45
    env:
      UV_MANAGED_PYTHON: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            architecture: X64
            rust_host: x86_64-pc-windows-msvc
            python_architecture: x86_64
            python_platform: win-amd64
          - runner: windows-11-arm
            architecture: ARM64
            rust_host: aarch64-pc-windows-msvc
            python_architecture: aarch64
            python_platform: win-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Resolve locked toolchain facts
        id: toolchain-facts
        run: node scripts/ci/verify-toolchain.mjs --emit-github-output

      - name: Setup uv and managed Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ steps.toolchain-facts.outputs.uv-version }}
          python-version: cpython-${{ steps.toolchain-facts.outputs.python-version }}-windows-${{ matrix.python_architecture }}-none
          enable-cache: false

      - name: Synchronize locked Python environment
        run: uv sync --locked --managed-python

      - name: Verify managed Windows toolchains
        run: node scripts/ci/verify-toolchain.mjs --tools node,uv,python,rust

      - name: Create frontend dist placeholder
        shell: pwsh
        run: New-Item -ItemType Directory -Force dist | Out-Null

      - name: Verify native Rust architecture
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -cne '${{ matrix.architecture }}') {
            throw "Runner architecture mismatch: expected ${{ matrix.architecture }}, got $env:RUNNER_ARCH"
          }
          $rustcFacts = @(& rustc -vV 2>&1)
          $rustcExitCode = $LASTEXITCODE
          $rustHostLines = @($rustcFacts | Where-Object { $_ -match '^host:\s+\S+\s*$' })
          if ($rustcExitCode -ne 0 -or $rustHostLines.Count -ne 1) {
            throw "rustc -vV did not report exactly one host triple"
          }
          $rustHost = ($rustHostLines[0] -replace '^host:\s+', '').Trim()
          if ($rustHost -cne '${{ matrix.rust_host }}') {
            throw "Rust host mismatch: expected ${{ matrix.rust_host }}, got $rustHost"
          }

      - name: Exercise explicit-SID Main package inventory
        shell: pwsh
        run: |
          $testName = "codex_desktop::platform::windows::deployment::tests::native_explicit_sid_main_query_smoke"
          $output = @(& cargo test --target '${{ matrix.rust_host }}' --lib --locked --manifest-path src-tauri/Cargo.toml $testName -- --exact 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          $joined = $output -join "`n"
          if ($exitCode -ne 0 -or $joined -notmatch "test result: ok\. 1 passed; 0 failed") {
            throw "The explicit-SID Main package inventory smoke did not execute exactly once"
          }

      - name: Verify managed Python architecture
        shell: pwsh
        run: |
          $pythonPlatform = uv run --locked --no-sync python -c "import sysconfig; print(sysconfig.get_platform())"
          if ($LASTEXITCODE -ne 0 -or $pythonPlatform -ne '${{ matrix.python_platform }}') {
            throw "Managed Python platform mismatch: expected ${{ matrix.python_platform }}, got $pythonPlatform"
          }

  backend-macos:
    name: Backend Checks (macOS)
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.backend == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - name: Verify active toolchains
        run: node scripts/ci/verify-toolchain.mjs --tools node,pnpm,rust

      - name: Create frontend dist placeholder
        run: mkdir -p dist

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets --locked --manifest-path src-tauri/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --locked --manifest-path src-tauri/Cargo.toml

  required:
    name: CI / Required
    if: always()
    needs:
      - changes
      - contracts
      - frontend
      - desktop-acceptance-contract
      - backend-linux
      - backend-windows
      - windows-native-contracts
      - backend-macos
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read current run-attempt job conclusions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            -f per_page=100 > current-run-jobs.json
          jq -e '.total_count == (.jobs | length)' current-run-jobs.json >/dev/null || {
            echo 'Current run-attempt job response was incomplete' >&2
            exit 1
          }

      - name: Evaluate required dependency results
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
          CI_CLASSIFICATION_PLAN: ${{ needs.changes.outputs.plan }}
        run: >-
          node scripts/ci/required-gate.mjs
          --jobs-json "$(jq -c . current-run-jobs.json)"
