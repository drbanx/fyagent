name: Release

# Authorized callers wait synchronously for this whole run to complete, then
# read its final state once. Do not attach background watchers or polling jobs;
# fetch failed-job logs only after the completed run reports failure.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable 40-character dev/laiyongjie HEAD SHA to preflight
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
  cancel-in-progress: false

jobs:
  eligibility:
    name: Freeze source and release eligibility
    runs-on: ubuntu-24.04
    env:
      GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      app_version: ${{ steps.contract.outputs.app_version }}
      release_tag: ${{ steps.contract.outputs.release_tag }}
      source_sha: ${{ steps.contract.outputs.source_sha }}
      workflow_sha: ${{ steps.contract.outputs.workflow_sha }}
      release_mode: ${{ steps.contract.outputs.release_mode }}
      generated_at: ${{ steps.contract.outputs.generated_at }}
      ci_run_id: ${{ steps.remote.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.remote.outputs.ci_run_attempt }}
    steps:
      - name: Validate the untrusted request envelope before checkout
        id: request
        shell: bash
        env:
          DISPATCH_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          expected_repository='NongHua123/fyagent'
          expected_repository_id='1313497021'
          expected_workflow_ref_prefix="${expected_repository}/.github/workflows/release.yml@"
          [ "$GITHUB_REPOSITORY" = "$expected_repository" ]
          [ "$GITHUB_REPOSITORY_ID" = "$expected_repository_id" ]
          [ "$GITHUB_WORKFLOW" = 'Release' ]
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              [[ "$DISPATCH_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
                echo 'workflow_dispatch source_sha must be a lowercase full 40-character commit SHA' >&2
                exit 1
              }
              if [ "$DISPATCH_SOURCE_SHA" != "$GITHUB_SHA" ] ||
                [ "$DISPATCH_SOURCE_SHA" != "$GITHUB_WORKFLOW_SHA" ]; then
                echo 'Preflight must attest the exact trusted dev workflow commit' >&2
                exit 1
              fi
              [ "$GITHUB_REF" = 'refs/heads/dev/laiyongjie' ]
              [ "$GITHUB_REF_TYPE" = 'branch' ]
              [ "$GITHUB_REF_NAME" = 'dev/laiyongjie' ]
              [ "$GITHUB_WORKFLOW_REF" = "${expected_workflow_ref_prefix}refs/heads/dev/laiyongjie" ]
              requested_source_sha="$DISPATCH_SOURCE_SHA"
              requested_mode='preflight'
              ;;
            push)
              [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
              [ "$GITHUB_REF_TYPE" = 'tag' ]
              [ "$GITHUB_REF" = "refs/tags/$GITHUB_REF_NAME" ]
              [ "$GITHUB_WORKFLOW_REF" = "${expected_workflow_ref_prefix}refs/tags/$GITHUB_REF_NAME" ]
              [ "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA" ]
              requested_source_sha="$GITHUB_SHA"
              requested_mode='formal'
              ;;
            *)
              echo "Unsupported release event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          printf 'requested_source_sha=%s\n' "$requested_source_sha" >> "$GITHUB_OUTPUT"
          printf 'requested_mode=%s\n' "$requested_mode" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted workflow definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Checkout requested candidate as untrusted data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate-source
          persist-credentials: false
          ref: ${{ steps.request.outputs.requested_source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Validate repository, workflow, ref, source, and version
        id: contract
        shell: bash
        env:
          DISPATCH_SOURCE_SHA: ${{ inputs.source_sha }}
          REQUESTED_MODE: ${{ steps.request.outputs.requested_mode }}
          REQUESTED_SOURCE_SHA: ${{ steps.request.outputs.requested_source_sha }}
        run: |
          set -euo pipefail

          expected_repository='NongHua123/fyagent'
          expected_repository_id='1313497021'
          expected_workflow_ref_prefix="${expected_repository}/.github/workflows/release.yml@"
          [ "$GITHUB_REPOSITORY" = "$expected_repository" ] || {
            echo "Unexpected repository: $GITHUB_REPOSITORY" >&2
            exit 1
          }
          [ "$GITHUB_REPOSITORY_ID" = "$expected_repository_id" ] || {
            echo "Unexpected repository ID: $GITHUB_REPOSITORY_ID" >&2
            exit 1
          }
          [ "$GITHUB_WORKFLOW" = 'Release' ] || {
            echo "Unexpected workflow name: $GITHUB_WORKFLOW" >&2
            exit 1
          }
          trusted_checkout_sha="$(git rev-parse HEAD)"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          workflow_commit="$(git rev-parse "${GITHUB_WORKFLOW_SHA}^{commit}")"
          if [ "$event_commit" != "$workflow_commit" ] || [ "$trusted_checkout_sha" != "$workflow_commit" ]; then
            echo "Event ($event_commit), workflow ($workflow_commit), and trusted checkout ($trusted_checkout_sha) sources must agree" >&2
            exit 1
          fi
          source_sha="$(git -C candidate-source rev-parse HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Candidate source is not a lowercase full commit SHA: $source_sha" >&2
            exit 1
          }

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              [[ "$DISPATCH_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
                echo 'workflow_dispatch source_sha must be a lowercase full 40-character commit SHA' >&2
                exit 1
              }
              [ "$GITHUB_REF" = 'refs/heads/dev/laiyongjie' ] || {
                echo "Preflight must run from trusted refs/heads/dev/laiyongjie; received $GITHUB_REF" >&2
                exit 1
              }
              [ "$GITHUB_WORKFLOW_REF" = "${expected_workflow_ref_prefix}refs/heads/dev/laiyongjie" ] || {
                echo "Preflight workflow ref is not trusted dev/laiyongjie: $GITHUB_WORKFLOW_REF" >&2
                exit 1
              }
              [ "$source_sha" = "$DISPATCH_SOURCE_SHA" ] || {
                echo "Dispatch input does not resolve to the exact candidate commit: $DISPATCH_SOURCE_SHA" >&2
                exit 1
              }
              if [ "$GITHUB_REF_TYPE" != 'branch' ] || [ "$GITHUB_REF_NAME" != 'dev/laiyongjie' ]; then
                echo 'Preflight event is not the exact dev/laiyongjie branch' >&2
                exit 1
              fi
              release_mode='preflight'
              ;;
            push)
              if [ "$GITHUB_REF_TYPE" != 'tag' ] || [ "$GITHUB_REF" != "refs/tags/$GITHUB_REF_NAME" ]; then
                echo 'Formal Release event is not a tag push' >&2
                exit 1
              fi
              [ "$GITHUB_WORKFLOW_REF" = "${expected_workflow_ref_prefix}refs/tags/$GITHUB_REF_NAME" ] || {
                echo "Formal workflow ref is not bound to the event tag: $GITHUB_WORKFLOW_REF" >&2
                exit 1
              }
              tag_commit="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
              if [ "$source_sha" != "$trusted_checkout_sha" ] ||
                [ "$source_sha" != "$event_commit" ] || [ "$source_sha" != "$tag_commit" ]; then
                echo 'Tag, event SHA, and checked-out source do not resolve to one commit' >&2
                exit 1
              fi
              release_mode='formal'
              ;;
            *)
              echo "Unsupported release event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          [ "$release_mode" = "$REQUESTED_MODE" ] || {
            echo "Request mode changed after checkout: $REQUESTED_MODE -> $release_mode" >&2
            exit 1
          }
          [ "$source_sha" = "$(git -C candidate-source rev-parse "${REQUESTED_SOURCE_SHA}^{commit}")" ] || {
            echo 'Requested source changed during candidate checkout' >&2
            exit 1
          }

          candidate_contract_root="$RUNNER_TEMP/fyagent-candidate-version-contract"
          rm -rf "$candidate_contract_root"
          mkdir -p "$candidate_contract_root/scripts" \
            "$candidate_contract_root/src-tauri"
          cp scripts/version.mjs "$candidate_contract_root/scripts/version.mjs"
          cp candidate-source/package.json "$candidate_contract_root/package.json"
          cp candidate-source/src-tauri/tauri.conf.json "$candidate_contract_root/src-tauri/tauri.conf.json"
          cp candidate-source/src-tauri/Cargo.toml "$candidate_contract_root/src-tauri/Cargo.toml"
          cp candidate-source/src-tauri/Cargo.lock "$candidate_contract_root/src-tauri/Cargo.lock"
          app_version="$(node "$candidate_contract_root/scripts/version.mjs" get)"
          release_tag="v$app_version"
          if [ "$release_mode" = 'formal' ] && [ "$release_tag" != "$GITHUB_REF_NAME" ]; then
            echo "Formal tag $GITHUB_REF_NAME does not match canonical version $app_version" >&2
            exit 1
          fi
          node "$candidate_contract_root/scripts/version.mjs" check --tag "$release_tag"

          {
            printf 'app_version=%s\n' "$app_version"
            printf 'release_tag=%s\n' "$release_tag"
            printf 'source_sha=%s\n' "$source_sha"
            printf 'workflow_sha=%s\n' "$workflow_commit"
            printf 'release_mode=%s\n' "$release_mode"
            printf 'generated_at=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          } >> "$GITHUB_OUTPUT"

      - name: Bind remote dev, tag, and successful Required CI evidence
        id: remote
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_APP_VERSION: ${{ steps.contract.outputs.app_version }}
          RELEASE_TAG: ${{ steps.contract.outputs.release_tag }}
          RELEASE_SOURCE_SHA: ${{ steps.contract.outputs.source_sha }}
          RELEASE_DISPATCH_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [ '${{ steps.contract.outputs.release_mode }}' = 'formal' ]; then
            unset RELEASE_DISPATCH_SOURCE_SHA
          fi
          frozen_eligibility="$RUNNER_TEMP/fyagent-release-eligibility.json"
          node scripts/release/verify-dev-release-remote.mjs \
            --json --evidence "$RUNNER_TEMP/fyagent-release-remote-evidence.json" \
            > "$frozen_eligibility"
          jq -e \
            --arg version '${{ steps.contract.outputs.app_version }}' \
            --arg tag '${{ steps.contract.outputs.release_tag }}' \
            --arg source '${{ steps.contract.outputs.source_sha }}' \
            --arg workflow '${{ steps.contract.outputs.workflow_sha }}' \
            --arg mode '${{ steps.contract.outputs.release_mode }}' \
            '.appVersion == $version and .releaseTag == $tag and
             .sourceSha == $source and .workflowSha == $workflow and
             .mode == $mode and
             (.ciRunId | test("^[1-9][0-9]*$")) and
             (.ciRunAttempt | test("^[1-9][0-9]*$"))' \
            "$frozen_eligibility" >/dev/null
          printf 'ci_run_id=%s\n' "$(jq -r '.ciRunId' "$frozen_eligibility")" >> "$GITHUB_OUTPUT"
          printf 'ci_run_attempt=%s\n' "$(jq -r '.ciRunAttempt' "$frozen_eligibility")" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Windows ${{ matrix.architecture }} NSIS installer
    needs: eligibility
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target_group: windows-x64
            architecture: x64
            rust_target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target_group: windows-arm64
            architecture: arm64
            rust_target: aarch64-pc-windows-msvc
    env:
      APP_VERSION: ${{ needs.eligibility.outputs.app_version }}
      RELEASE_TAG: ${{ needs.eligibility.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.eligibility.outputs.source_sha }}
      RELEASE_MODE: ${{ needs.eligibility.outputs.release_mode }}
      EXPECTED_CI_RUN_ID: ${{ needs.eligibility.outputs.ci_run_id }}
      EXPECTED_CI_RUN_ATTEMPT: ${{ needs.eligibility.outputs.ci_run_attempt }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.eligibility.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
          cache: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.97.1
          target: ${{ matrix.rust_target }}
          cache: false

      - name: Verify native runner and frozen toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedRunnerArch = if ('${{ matrix.architecture }}' -eq 'arm64') { 'ARM64' } else { 'X64' }
          if ($env:RUNNER_ARCH -cne $expectedRunnerArch) {
            throw "Windows runner architecture $env:RUNNER_ARCH is not native $expectedRunnerArch"
          }
          if ((git rev-parse HEAD) -cne $env:SOURCE_SHA) {
            throw 'Windows checkout is not the frozen source SHA'
          }
          pnpm run version:check -- --tag $env:RELEASE_TAG
          $nodeVersion = node --version
          $pnpmVersion = pnpm --version
          $rustVersion = rustc --version
          if ($nodeVersion -cne 'v24.19.0' -or $pnpmVersion -cne '10.12.3' -or
              -not $rustVersion.StartsWith('rustc 1.97.1 ', [StringComparison]::Ordinal)) {
            throw "Toolchain drift: node=$nodeVersion pnpm=$pnpmVersion rustc=$rustVersion"
          }
          "ACTUAL_NODE_VERSION=$nodeVersion" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ACTUAL_PNPM_VERSION=$pnpmVersion" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ACTUAL_RUST_VERSION=$rustVersion" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure native LLVM on Windows ARM64
        if: matrix.architecture == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmBin = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $llvmBin 'clang.exe') -PathType Leaf)) {
            throw "Native LLVM was not found at $llvmBin"
          }
          "LIBCLANG_PATH=$llvmBin" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CLANG_PATH=$(Join-Path $llvmBin 'clang.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $llvmBin | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Windows NSIS source contract before build
        run: node scripts/release/verify-windows-nsis-contract.mjs

      - name: Build Windows application executable
        shell: pwsh
        env:
          FYAGENT_WINDOWS_MANIFEST: release
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ matrix.architecture }}' -eq 'arm64') {
            pnpm tauri build --target '${{ matrix.rust_target }}' --no-bundle
            $targetRoot = 'src-tauri/target/${{ matrix.rust_target }}/release'
          } else {
            pnpm tauri build --no-bundle
            $targetRoot = 'src-tauri/target/release'
          }
          $exePath = Join-Path $targetRoot 'fyagent.exe'
          if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) {
            throw "Windows release executable not found: $exePath"
          }
          "FYAGENT_WINDOWS_TARGET_ROOT=$targetRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FYAGENT_WINDOWS_EXE=$exePath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify elevated release manifest before NSIS bundle
        shell: pwsh
        run: |
          ./scripts/release/verify-windows-release-manifest.ps1 `
            -ExePath $env:FYAGENT_WINDOWS_EXE `
            -AppVersion $env:APP_VERSION `
            -Architecture '${{ matrix.architecture }}' `
            -Phase before-nsis-bundle

      - name: Bundle Windows NSIS setup executable
        shell: pwsh
        env:
          FYAGENT_WINDOWS_MANIFEST: release
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ matrix.architecture }}' -eq 'arm64') {
            pnpm tauri bundle --target '${{ matrix.rust_target }}' --bundles nsis --verbose
            $bundleExitCode = $LASTEXITCODE
          } else {
            pnpm tauri bundle --bundles nsis --verbose
            $bundleExitCode = $LASTEXITCODE
          }
          if ($bundleExitCode -ne 0) {
            throw "Tauri NSIS bundle failed with exit code $bundleExitCode"
          }
          $setups = @(
            Get-ChildItem -Path (Join-Path $env:FYAGENT_WINDOWS_TARGET_ROOT 'bundle/nsis') `
              -Recurse -Filter *.exe -File -ErrorAction Stop
          )
          if ($setups.Count -ne 1) {
            throw "Expected exactly one raw Windows NSIS setup executable, found $($setups.Count)"
          }
          "FYAGENT_WINDOWS_RAW_SETUP=$($setups[0].FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Re-verify elevated application manifest after NSIS bundle
        shell: pwsh
        run: |
          ./scripts/release/verify-windows-release-manifest.ps1 `
            -ExePath $env:FYAGENT_WINDOWS_EXE `
            -AppVersion $env:APP_VERSION `
            -Architecture '${{ matrix.architecture }}' `
            -Phase after-nsis-bundle

      - name: Re-verify Windows NSIS source contract after bundle
        run: node scripts/release/verify-windows-nsis-contract.mjs

      - name: Normalize exact unsigned Windows candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force raw-windows-candidate | Out-Null
          $assetName = "FyAgent-$env:APP_VERSION-Windows-${{ matrix.architecture }}-setup.exe"
          $assetPath = Join-Path raw-windows-candidate $assetName
          Copy-Item -LiteralPath $env:FYAGENT_WINDOWS_RAW_SETUP -Destination $assetPath
          $entries = @(Get-ChildItem -LiteralPath raw-windows-candidate -Force)
          if ($entries.Count -ne 1 -or -not ($entries[0] -is [IO.FileInfo])) {
            throw "Expected exactly one normalized raw Windows candidate, found $($entries.Count)"
          }
          if (($entries[0].Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              $entries[0].Length -le 0 -or $entries[0].Name -cne $assetName) {
            throw 'Normalized raw Windows candidate is not the exact expected regular file'
          }
          "FYAGENT_WINDOWS_RAW_ASSET=$assetPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prove raw Windows candidate is strictly unsigned
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceJson = & ./scripts/release/windows-signing-evidence.ps1 `
            -ArtifactPath $env:FYAGENT_WINDOWS_RAW_ASSET
          $evidence = $evidenceJson | ConvertFrom-Json -Depth 6
          if ($evidence.schema -cne 'fyagent-authenticode-evidence/v1' -or
              $evidence.status -cne 'NotSigned' -or
              $null -ne $evidence.publisher -or
              $null -ne $evidence.signerCertificate -or
              $null -ne $evidence.timestampCertificate) {
            throw 'Raw Windows candidate is not strictly Authenticode-unsigned'
          }

          $bytes = [IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $env:FYAGENT_WINDOWS_RAW_ASSET).Path)
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
            throw 'Raw Windows candidate does not contain a valid DOS header'
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or $peOffset + 26 -gt $bytes.Length -or
              [BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550) {
            throw 'Raw Windows candidate does not contain a valid PE header'
          }
          $optionalHeaderSize = [BitConverter]::ToUInt16($bytes, $peOffset + 20)
          $optionalHeaderOffset = $peOffset + 24
          if ($optionalHeaderOffset + $optionalHeaderSize -gt $bytes.Length) {
            throw 'Raw Windows candidate optional header is truncated'
          }
          $optionalMagic = [BitConverter]::ToUInt16($bytes, $optionalHeaderOffset)
          switch ($optionalMagic) {
            0x010b {
              $numberOfDirectoriesOffset = $optionalHeaderOffset + 92
              $dataDirectoryOffset = $optionalHeaderOffset + 96
            }
            0x020b {
              $numberOfDirectoriesOffset = $optionalHeaderOffset + 108
              $dataDirectoryOffset = $optionalHeaderOffset + 112
            }
            default { throw 'Raw Windows candidate has an unsupported PE optional header' }
          }
          $securityDirectoryOffset = $dataDirectoryOffset + (4 * 8)
          if ($numberOfDirectoriesOffset + 4 -gt $optionalHeaderOffset + $optionalHeaderSize -or
              [BitConverter]::ToUInt32($bytes, $numberOfDirectoriesOffset) -lt 5 -or
              $securityDirectoryOffset + 8 -gt $optionalHeaderOffset + $optionalHeaderSize) {
            throw 'Raw Windows candidate does not expose the PE security directory'
          }
          if ([BitConverter]::ToUInt32($bytes, $securityDirectoryOffset) -ne 0 -or
              [BitConverter]::ToUInt32($bytes, $securityDirectoryOffset + 4) -ne 0) {
            throw 'Raw Windows candidate PE security directory is not empty'
          }

      - name: Record Windows build metadata
        shell: pwsh
        env:
          TARGET_GROUP: ${{ matrix.target_group }}
          TARGET_PLATFORM: windows
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}
          REQUESTED_RUNNER_LABEL: ${{ matrix.runner }}
          ACTUAL_RUNNER_OS: ${{ runner.os }}
          ACTUAL_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force platform-metadata | Out-Null
          node scripts/release/write-platform-metadata.mjs "platform-metadata/${{ matrix.target_group }}.json"

      - name: Upload private unsigned Windows candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-${{ matrix.target_group }}
          path: raw-windows-candidate/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows build metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metadata-${{ matrix.target_group }}
          path: platform-metadata/*
          if-no-files-found: error
          retention-days: 7

  prove-windows-preflight:
    name: Windows ${{ matrix.architecture }} unsigned preflight sealing
    if: needs.eligibility.outputs.release_mode == 'preflight' && github.event_name == 'workflow_dispatch'
    needs: [eligibility, pin-release-build-inputs]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target_group: windows-x64
            architecture: x64
          - runner: windows-11-arm
            target_group: windows-arm64
            architecture: arm64
    env:
      APP_VERSION: ${{ needs.eligibility.outputs.app_version }}
      SOURCE_SHA: ${{ needs.eligibility.outputs.source_sha }}
    steps:
      - name: Checkout immutable preflight boundary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.eligibility.outputs.source_sha }}

      - name: Setup exact preflight Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Verify clean native preflight runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedRunnerArch = if ('${{ matrix.architecture }}' -eq 'arm64') { 'ARM64' } else { 'X64' }
          if ($env:RUNNER_ARCH -cne $expectedRunnerArch) {
            throw "Windows preflight runner architecture $env:RUNNER_ARCH is not native $expectedRunnerArch"
          }
          if ((git rev-parse HEAD) -cne $env:SOURCE_SHA) {
            throw 'Windows preflight checkout is not the frozen source SHA'
          }
          $declaredNodeVersion = (Get-Content -LiteralPath .node-version -Raw).Trim()
          $actualNodeVersion = (node --version).TrimStart('v')
          if ($actualNodeVersion -cne $declaredNodeVersion -or $actualNodeVersion -cne '24.19.0') {
            throw "Windows preflight Node.js drift: declared=$declaredNodeVersion actual=$actualNodeVersion"
          }

      - name: Download immutable pre-signer build inputs for preflight
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs['pin-release-build-inputs'].outputs.artifact_id }}
          path: trusted-build-inputs

      - name: Verify immutable pre-signer build inputs for preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/release/pin-release-build-inputs.mjs verify `
            trusted-build-inputs $env:APP_VERSION $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned release build input verification failed with exit code $LASTEXITCODE"
          }

      - name: Admit exact raw Windows preflight candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedName = "FyAgent-$env:APP_VERSION-Windows-${{ matrix.architecture }}-setup.exe"
          $entries = @(Get-ChildItem -LiteralPath 'trusted-build-inputs/raw-${{ matrix.target_group }}' -Force)
          if ($entries.Count -ne 1 -or -not ($entries[0] -is [IO.FileInfo])) {
            throw "Expected exactly one downloaded raw Windows candidate, found $($entries.Count)"
          }
          $candidate = $entries[0]
          $candidateIsInvalid = (
            $candidate.Name -cne $expectedName -or
            $candidate.Length -le 0 -or
            ($candidate.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
          )
          if ($candidateIsInvalid) {
            throw 'Downloaded raw Windows candidate is not the exact expected regular file'
          }
          New-Item -ItemType Directory -Force release-assets, signing-fragments | Out-Null
          $assetPath = Join-Path release-assets $expectedName
          Copy-Item -LiteralPath $candidate.FullName -Destination $assetPath
          "FYAGENT_WINDOWS_ASSET=$assetPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FYAGENT_WINDOWS_SIGNING_FRAGMENT=signing-fragments/windows-signing-${{ matrix.architecture }}.json" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prove unsigned preflight Windows setup executable
        shell: pwsh
        env:
          FYAGENT_WINDOWS_SIGNING_MODE: unsigned
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/release/windows-signing.mjs asset `
            --asset $env:FYAGENT_WINDOWS_ASSET `
            --architecture '${{ matrix.architecture }}' `
            --version $env:APP_VERSION `
            --source-sha $env:SOURCE_SHA `
            --output $env:FYAGENT_WINDOWS_SIGNING_FRAGMENT
          if ($LASTEXITCODE -ne 0) {
            throw "Windows unsigned preflight evidence failed with exit code $LASTEXITCODE"
          }

      - name: Validate unsigned Windows preflight output before immutable upload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assetItem = Get-Item -LiteralPath $env:FYAGENT_WINDOWS_ASSET -Force
          $fragmentItem = Get-Item -LiteralPath $env:FYAGENT_WINDOWS_SIGNING_FRAGMENT -Force
          if (-not ($assetItem -is [IO.FileInfo]) -or
              ($assetItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              $assetItem.Length -le 0 -or
              -not ($fragmentItem -is [IO.FileInfo]) -or
              ($fragmentItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              $fragmentItem.Length -le 0) {
            throw 'Windows preflight output is not an exact pair of non-empty regular files'
          }
          $fragment = Get-Content -LiteralPath $fragmentItem.FullName -Raw | ConvertFrom-Json -Depth 8
          $expectedAssetName = "FyAgent-$env:APP_VERSION-Windows-${{ matrix.architecture }}-setup.exe"
          $assetSha256 = (Get-FileHash -LiteralPath $assetItem.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($fragment.schema -cne 'fyagent-windows-signing-asset/v1' -or
              $fragment.version -cne $env:APP_VERSION -or
              $fragment.sourceSha -cne $env:SOURCE_SHA -or
              $fragment.mode -cne 'unsigned' -or
              $fragment.asset.name -cne $expectedAssetName -or
              $fragment.asset.architecture -cne '${{ matrix.architecture }}' -or
              [int64]$fragment.asset.sizeBytes -ne $assetItem.Length -or
              $fragment.asset.sha256 -cne $assetSha256 -or
              $fragment.asset.signature.status -cne 'NotSigned' -or
              $null -ne $fragment.asset.signature.publisher -or
              $null -ne $fragment.asset.signature.signerCertificate -or
              $null -ne $fragment.asset.signature.timestampCertificate) {
            throw 'Windows preflight output is not strictly unsigned and byte-bound'
          }

      - name: Upload sealed Windows preflight installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.target_group }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload sealed Windows preflight signing fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-${{ matrix.target_group }}
          path: signing-fragments/*
          if-no-files-found: error
          retention-days: 7

  sign-windows-formal:
    name: Windows ${{ matrix.architecture }} formal signing
    if: needs.eligibility.outputs.release_mode == 'formal' && github.event_name == 'push'
    needs: [eligibility, pin-release-build-inputs]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target_group: windows-x64
            architecture: x64
          - runner: windows-11-arm
            target_group: windows-arm64
            architecture: arm64
    env:
      APP_VERSION: ${{ needs.eligibility.outputs.app_version }}
      SOURCE_SHA: ${{ needs.eligibility.outputs.source_sha }}
    steps:
      - name: Checkout immutable signing boundary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.eligibility.outputs.source_sha }}

      - name: Setup exact signing Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Verify clean native signing runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedRunnerArch = if ('${{ matrix.architecture }}' -eq 'arm64') { 'ARM64' } else { 'X64' }
          if ($env:RUNNER_ARCH -cne $expectedRunnerArch) {
            throw "Windows signing runner architecture $env:RUNNER_ARCH is not native $expectedRunnerArch"
          }
          if ((git rev-parse HEAD) -cne $env:SOURCE_SHA) {
            throw 'Windows signing checkout is not the frozen source SHA'
          }
          $declaredNodeVersion = (Get-Content -LiteralPath .node-version -Raw).Trim()
          $actualNodeVersion = (node --version).TrimStart('v')
          if ($actualNodeVersion -cne $declaredNodeVersion -or $actualNodeVersion -cne '24.19.0') {
            throw "Windows signing Node.js drift: declared=$declaredNodeVersion actual=$actualNodeVersion"
          }

      - name: Download immutable pre-signer build inputs for formal signing
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs['pin-release-build-inputs'].outputs.artifact_id }}
          path: trusted-build-inputs

      - name: Verify immutable pre-signer build inputs for formal signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/release/pin-release-build-inputs.mjs verify `
            trusted-build-inputs $env:APP_VERSION $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned release build input verification failed with exit code $LASTEXITCODE"
          }

      - name: Admit exact raw Windows candidate for untrusted transformation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedName = "FyAgent-$env:APP_VERSION-Windows-${{ matrix.architecture }}-setup.exe"
          $entries = @(Get-ChildItem -LiteralPath 'trusted-build-inputs/raw-${{ matrix.target_group }}' -Force)
          if ($entries.Count -ne 1 -or -not ($entries[0] -is [IO.FileInfo])) {
            throw "Expected exactly one downloaded raw Windows candidate, found $($entries.Count)"
          }
          $candidate = $entries[0]
          $candidateIsInvalid = (
            $candidate.Name -cne $expectedName -or
            $candidate.Length -le 0 -or
            ($candidate.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
          )
          if ($candidateIsInvalid) {
            throw 'Downloaded raw Windows candidate is not the exact expected regular file'
          }
          New-Item -ItemType Directory -Force formal-candidate | Out-Null
          $assetPath = Join-Path formal-candidate $expectedName
          Copy-Item -LiteralPath $candidate.FullName -Destination $assetPath
          $finalEntries = @(Get-ChildItem -LiteralPath formal-candidate -Force)
          $finalSetIsInvalid = (
            $finalEntries.Count -ne 1 -or
            -not ($finalEntries[0] -is [IO.FileInfo]) -or
            $finalEntries[0].Name -cne $expectedName -or
            ($finalEntries[0].Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
          )
          if ($finalSetIsInvalid) {
            throw 'Formal Windows candidate directory is not an exact one-file set'
          }
          "FYAGENT_WINDOWS_CANDIDATE=$assetPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Produce untrusted formal Windows candidate
        shell: pwsh
        env:
          SIGNING_MODE_CONFIG: ${{ vars.FYAGENT_WINDOWS_SIGNING_MODE }}
          SIGNER_ADAPTER_BASE64_CONFIG: ${{ secrets.FYAGENT_WINDOWS_SIGNER_ADAPTER_BASE64 }}
          SIGNER_PUBLISHER_CONFIG: ${{ vars.FYAGENT_WINDOWS_SIGN_EXPECTED_PUBLISHER }}
          SIGNER_CERTIFICATE_CONFIG: ${{ vars.FYAGENT_WINDOWS_SIGN_EXPECTED_CERTIFICATE_SHA256 }}
          SIGNER_CREDENTIAL_CONFIG: ${{ secrets.FYAGENT_WINDOWS_SIGNER_CREDENTIAL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $managedSignerEnvironment = @(
            'FYAGENT_WINDOWS_SIGNING_MODE',
            'FYAGENT_WINDOWS_SIGNER_ADAPTER',
            'FYAGENT_WINDOWS_SIGN_EXPECTED_PUBLISHER',
            'FYAGENT_WINDOWS_SIGN_EXPECTED_CERTIFICATE_SHA256',
            'FYAGENT_WINDOWS_SIGNER_CREDENTIAL'
          )
          $stagingSignerEnvironment = @(
            'SIGNING_MODE_CONFIG',
            'SIGNER_ADAPTER_BASE64_CONFIG',
            'SIGNER_PUBLISHER_CONFIG',
            'SIGNER_CERTIFICATE_CONFIG',
            'SIGNER_CREDENTIAL_CONFIG'
          )
          $providerConfig = @(
            [string]$env:SIGNER_ADAPTER_BASE64_CONFIG,
            [string]$env:SIGNER_PUBLISHER_CONFIG,
            [string]$env:SIGNER_CERTIFICATE_CONFIG,
            [string]$env:SIGNER_CREDENTIAL_CONFIG
          )
          $hasProviderConfig = @(
            $providerConfig | Where-Object { $_ -cne '' }
          ).Count -ne 0
          foreach ($name in $managedSignerEnvironment) {
            [Environment]::SetEnvironmentVariable($name, $null, 'Process')
          }

          $adapterPath = $null
          $requiredProviderConfig = $null
          try {
            switch -CaseSensitive ([string]$env:SIGNING_MODE_CONFIG) {
              '' {
                if ($hasProviderConfig) {
                  throw 'FYAGENT_WINDOWS_SIGNING_MODE must select provider before defining signer configuration.'
                }
              }
              'unsigned' {
                if ($hasProviderConfig) {
                  throw 'Signer configuration must be absent when FYAGENT_WINDOWS_SIGNING_MODE is unsigned.'
                }
                [Environment]::SetEnvironmentVariable('FYAGENT_WINDOWS_SIGNING_MODE', 'unsigned', 'Process')
              }
              'provider' {
                $requiredProviderConfig = @(
                  [string]$env:SIGNER_ADAPTER_BASE64_CONFIG,
                  [string]$env:SIGNER_PUBLISHER_CONFIG,
                  [string]$env:SIGNER_CERTIFICATE_CONFIG
                )
                if (@($requiredProviderConfig | Where-Object { $_ -ceq '' }).Count -ne 0) {
                  throw 'Provider signing requires adapter bytes, expected publisher, and certificate SHA-256.'
                }
                try {
                  $adapterBytes = [Convert]::FromBase64String($env:SIGNER_ADAPTER_BASE64_CONFIG)
                } catch {
                  throw 'FYAGENT_WINDOWS_SIGNER_ADAPTER_BASE64 is not valid base64.'
                }
                if ($adapterBytes.Length -eq 0 -or $adapterBytes.Length -gt 49152) {
                  throw 'FYAGENT_WINDOWS_SIGNER_ADAPTER_BASE64 must decode to 1..49152 bytes.'
                }
                $adapterName = ".fyagent-windows-signer-$([Guid]::NewGuid().ToString('N')).ps1"
                $adapterPath = [IO.Path]::Combine($env:RUNNER_TEMP, $adapterName)
                $adapterStream = [IO.FileStream]::new(
                  $adapterPath,
                  [IO.FileMode]::CreateNew,
                  [IO.FileAccess]::Write,
                  [IO.FileShare]::None
                )
                try {
                  $adapterStream.Write($adapterBytes, 0, $adapterBytes.Length)
                  $adapterStream.Flush($true)
                } finally {
                  $adapterStream.Dispose()
                  [Array]::Clear($adapterBytes, 0, $adapterBytes.Length)
                }
                [Environment]::SetEnvironmentVariable('FYAGENT_WINDOWS_SIGNING_MODE', 'provider', 'Process')
                [Environment]::SetEnvironmentVariable('FYAGENT_WINDOWS_SIGNER_ADAPTER', $adapterPath, 'Process')
                [Environment]::SetEnvironmentVariable('FYAGENT_WINDOWS_SIGN_EXPECTED_PUBLISHER', $env:SIGNER_PUBLISHER_CONFIG, 'Process')
                [Environment]::SetEnvironmentVariable('FYAGENT_WINDOWS_SIGN_EXPECTED_CERTIFICATE_SHA256', $env:SIGNER_CERTIFICATE_CONFIG, 'Process')
                if ([string]$env:SIGNER_CREDENTIAL_CONFIG -cne '') {
                  [Environment]::SetEnvironmentVariable('FYAGENT_WINDOWS_SIGNER_CREDENTIAL', $env:SIGNER_CREDENTIAL_CONFIG, 'Process')
                }
              }
              default {
                throw 'FYAGENT_WINDOWS_SIGNING_MODE must be unsigned or provider.'
              }
            }
            foreach ($name in $stagingSignerEnvironment) {
              [Environment]::SetEnvironmentVariable($name, $null, 'Process')
            }
            [Array]::Clear($providerConfig, 0, $providerConfig.Length)
            if ($null -ne $requiredProviderConfig) {
              [Array]::Clear($requiredProviderConfig, 0, $requiredProviderConfig.Length)
            }
            node scripts/release/windows-signing.mjs transform `
              --asset $env:FYAGENT_WINDOWS_CANDIDATE `
              --architecture '${{ matrix.architecture }}' `
              --version $env:APP_VERSION `
              --source-sha $env:SOURCE_SHA
            if ($LASTEXITCODE -ne 0) {
              throw "Windows formal candidate transformation failed with exit code $LASTEXITCODE"
            }
          } finally {
            foreach ($name in @($managedSignerEnvironment + $stagingSignerEnvironment)) {
              [Environment]::SetEnvironmentVariable($name, $null, 'Process')
            }
            if ($providerConfig.Length -gt 0) {
              [Array]::Clear($providerConfig, 0, $providerConfig.Length)
            }
            if ($null -ne $requiredProviderConfig) {
              [Array]::Clear($requiredProviderConfig, 0, $requiredProviderConfig.Length)
            }
            if ($null -ne $adapterPath -and [IO.File]::Exists($adapterPath)) {
              [IO.File]::Delete($adapterPath)
            }
          }

      - name: Upload untrusted formal Windows candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formal-candidate-${{ matrix.target_group }}
          path: formal-candidate/*
          if-no-files-found: error
          retention-days: 7

  seal-windows-formal:
    name: Windows ${{ matrix.architecture }} fresh formal verification and sealing
    if: needs.eligibility.outputs.release_mode == 'formal' && github.event_name == 'push'
    needs: [eligibility, pin-release-build-inputs, sign-windows-formal]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target_group: windows-x64
            architecture: x64
          - runner: windows-11-arm
            target_group: windows-arm64
            architecture: arm64
    env:
      APP_VERSION: ${{ needs.eligibility.outputs.app_version }}
      SOURCE_SHA: ${{ needs.eligibility.outputs.source_sha }}
      PUBLIC_SIGNING_MODE: ${{ vars.FYAGENT_WINDOWS_SIGNING_MODE }}
      PUBLIC_EXPECTED_PUBLISHER: ${{ vars.FYAGENT_WINDOWS_SIGN_EXPECTED_PUBLISHER }}
      PUBLIC_EXPECTED_CERTIFICATE_SHA256: ${{ vars.FYAGENT_WINDOWS_SIGN_EXPECTED_CERTIFICATE_SHA256 }}
    steps:
      - name: Checkout immutable formal verification boundary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.eligibility.outputs.source_sha }}

      - name: Setup exact formal verification Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Verify fresh native formal sealer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedRunnerArch = if ('${{ matrix.architecture }}' -eq 'arm64') { 'ARM64' } else { 'X64' }
          if ($env:RUNNER_ARCH -cne $expectedRunnerArch) {
            throw "Windows formal sealer architecture $env:RUNNER_ARCH is not native $expectedRunnerArch"
          }
          if ((git rev-parse HEAD) -cne $env:SOURCE_SHA) {
            throw 'Windows formal sealer checkout is not the frozen source SHA'
          }
          $declaredNodeVersion = (Get-Content -LiteralPath .node-version -Raw).Trim()
          $actualNodeVersion = (node --version).TrimStart('v')
          if ($actualNodeVersion -cne $declaredNodeVersion -or $actualNodeVersion -cne '24.19.0') {
            throw "Windows formal sealer Node.js drift: declared=$declaredNodeVersion actual=$actualNodeVersion"
          }

      - name: Download immutable pre-signer build inputs for independent verification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs['pin-release-build-inputs'].outputs.artifact_id }}
          path: trusted-build-inputs

      - name: Verify immutable pre-signer build inputs independently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/release/pin-release-build-inputs.mjs verify `
            trusted-build-inputs $env:APP_VERSION $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned release build input verification failed with exit code $LASTEXITCODE"
          }

      - name: Download untrusted formal Windows candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: formal-candidate-${{ matrix.target_group }}
          path: formal-verification/candidate

      - name: Admit exact raw and formal candidate pair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedName = "FyAgent-$env:APP_VERSION-Windows-${{ matrix.architecture }}-setup.exe"
          $rawEntries = @(Get-ChildItem -LiteralPath 'trusted-build-inputs/raw-${{ matrix.target_group }}' -Force)
          $candidateEntries = @(Get-ChildItem -LiteralPath formal-verification/candidate -Force)
          foreach ($entries in @($rawEntries, $candidateEntries)) {
            if ($entries.Count -ne 1 -or
                -not ($entries[0] -is [IO.FileInfo]) -or
                $entries[0].Name -cne $expectedName -or
                ($entries[0].Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                $entries[0].Length -le 0) {
              throw 'Formal verification input is not the exact expected regular file'
            }
          }
          New-Item -ItemType Directory -Force release-assets, signing-fragments | Out-Null
          $finalAsset = Join-Path release-assets $expectedName
          Copy-Item -LiteralPath $candidateEntries[0].FullName -Destination $finalAsset
          "FYAGENT_WINDOWS_RAW_ASSET=$($rawEntries[0].FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FYAGENT_WINDOWS_FINAL_ASSET=$finalAsset" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FYAGENT_WINDOWS_SIGNING_FRAGMENT=signing-fragments/windows-signing-${{ matrix.architecture }}.json" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Independently verify and seal formal Windows candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commonArguments = @(
            'scripts/release/windows-signing.mjs',
            'verify-sealed',
            '--raw', $env:FYAGENT_WINDOWS_RAW_ASSET,
            '--candidate', $env:FYAGENT_WINDOWS_FINAL_ASSET,
            '--architecture', '${{ matrix.architecture }}',
            '--version', $env:APP_VERSION,
            '--source-sha', $env:SOURCE_SHA,
            '--output', $env:FYAGENT_WINDOWS_SIGNING_FRAGMENT
          )
          switch -CaseSensitive ([string]$env:PUBLIC_SIGNING_MODE) {
            '' {
              if ([string]$env:PUBLIC_EXPECTED_PUBLISHER -cne '' -or
                  [string]$env:PUBLIC_EXPECTED_CERTIFICATE_SHA256 -cne '') {
                throw 'Absent Windows signing mode cannot define public provider policy.'
              }
              & node @commonArguments --mode unsigned
            }
            'unsigned' {
              if ([string]$env:PUBLIC_EXPECTED_PUBLISHER -cne '' -or
                  [string]$env:PUBLIC_EXPECTED_CERTIFICATE_SHA256 -cne '') {
                throw 'Unsigned Windows signing mode cannot define public provider policy.'
              }
              & node @commonArguments --mode unsigned
            }
            'provider' {
              if ([string]$env:PUBLIC_EXPECTED_PUBLISHER -ceq '' -or
                  [string]$env:PUBLIC_EXPECTED_CERTIFICATE_SHA256 -ceq '') {
                throw 'Provider mode requires complete public publisher and certificate policy.'
              }
              & node @commonArguments `
                --mode provider `
                --expected-publisher $env:PUBLIC_EXPECTED_PUBLISHER `
                --expected-certificate-sha256 $env:PUBLIC_EXPECTED_CERTIFICATE_SHA256
            }
            default { throw 'FYAGENT_WINDOWS_SIGNING_MODE must be unsigned or provider.' }
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Independent Windows formal verification failed with exit code $LASTEXITCODE"
          }

      - name: Upload independently sealed final Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.target_group }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload independently generated Windows signing fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-${{ matrix.target_group }}
          path: signing-fragments/*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Linux ${{ matrix.architecture }} unsigned installers
    needs: eligibility
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container_image }}@${{ matrix.container_digest }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target_group: linux-x64
            architecture: x64
            expected_runner_arch: X64
            asset_arch: x86_64
            uname_arch: x86_64
            deb_arch: amd64
            rpm_arch: x86_64
            container_image: docker.io/library/ubuntu:22.04
            container_digest: sha256:0199853f6d6b20b0424f3c5694a72a62764f01e6a771b1eb48a4197848986c7e
          - runner: ubuntu-24.04-arm
            target_group: linux-arm64
            architecture: arm64
            expected_runner_arch: ARM64
            asset_arch: arm64
            uname_arch: aarch64
            deb_arch: arm64
            rpm_arch: aarch64
            container_image: docker.io/library/ubuntu:22.04
            container_digest: sha256:a8cdd2158a73d7e5c02aa351fe269f48f57cf710a241db86e9ede371fc150149
    env:
      APP_VERSION: ${{ needs.eligibility.outputs.app_version }}
      RELEASE_TAG: ${{ needs.eligibility.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.eligibility.outputs.source_sha }}
      RELEASE_MODE: ${{ needs.eligibility.outputs.release_mode }}
      EXPECTED_CI_RUN_ID: ${{ needs.eligibility.outputs.ci_run_id }}
      EXPECTED_CI_RUN_ATTEMPT: ${{ needs.eligibility.outputs.ci_run_attempt }}
    steps:
      - name: Install Ubuntu 22.04 native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          [ "$RUNNER_ARCH" = '${{ matrix.expected_runner_arch }}' ] || {
            echo "Linux runner architecture $RUNNER_ARCH is not native ${{ matrix.expected_runner_arch }}" >&2
            exit 1
          }
          if [ "$ID" != ubuntu ] || [ "$VERSION_ID" != '22.04' ]; then
            echo "Release container is not Ubuntu 22.04: ${ID:-unknown} ${VERSION_ID:-unknown}" >&2
            exit 1
          fi
          [ "$(uname -m)" = '${{ matrix.uname_arch }}' ] || {
            echo "Container architecture $(uname -m) is not native ${{ matrix.uname_arch }}" >&2
            exit 1
          }
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file git libayatana-appindicator3-dev \
            libfuse2 librsvg2-dev libssl-dev patchelf pkg-config rpm wget xdg-utils
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            || DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              libgtk-3-dev libwebkit2gtk-4.0-dev libsoup2.4-dev

      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.eligibility.outputs.source_sha }}

      - name: Trust exact checked-out workspace for container Git
        shell: bash
        run: |
          set -euo pipefail
          [ "$PWD" = "$GITHUB_WORKSPACE" ] || {
            echo "Linux container workspace drift: $PWD != $GITHUB_WORKSPACE" >&2
            exit 1
          }
          git config --global --unset-all safe.directory 2>/dev/null || true
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          [ "$(git config --get-all safe.directory)" = "$GITHUB_WORKSPACE" ] || {
            echo 'Linux container Git trust is not limited to the exact workspace' >&2
            exit 1
          }
          [ "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$SOURCE_SHA" ]

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
          cache: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.97.1
          cache: false

      - name: Verify native source and frozen toolchain
        shell: bash
        run: |
          set -euo pipefail
          [ "$(uname -m)" = '${{ matrix.uname_arch }}' ]
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          pnpm run version:check -- --tag "$RELEASE_TAG"
          node_version="$(node --version)"
          pnpm_version="$(pnpm --version)"
          rust_version="$(rustc --version)"
          [ "$node_version" = 'v24.19.0' ]
          [ "$pnpm_version" = '10.12.3' ]
          case "$rust_version" in 'rustc 1.97.1 '*) ;; *) echo "Rust drift: $rust_version" >&2; exit 1;; esac
          {
            printf 'ACTUAL_NODE_VERSION=%s\n' "$node_version"
            printf 'ACTUAL_PNPM_VERSION=%s\n' "$pnpm_version"
            printf 'ACTUAL_RUST_VERSION=%s\n' "$rust_version"
          } >> "$GITHUB_ENV"

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native Linux packages
        env:
          # tauri-cli 2.8.1 embeds tauri-bundler 2.6.1, whose nested
          # linuxdeploy AppImage invocation needs extraction mode on runners
          # without FUSE or mount privileges.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm tauri build --bundles appimage,deb,rpm --verbose

      - name: Verify and normalize exact Linux package set
        shell: bash
        run: |
          set -euo pipefail
          bundle_root='src-tauri/target/release/bundle'
          mapfile -t appimages < <(find "$bundle_root" -type f -name '*.AppImage' -print)
          mapfile -t debs < <(find "$bundle_root" -type f -name '*.deb' -print)
          mapfile -t rpms < <(find "$bundle_root" -type f -name '*.rpm' -print)
          if [ "${#appimages[@]}" -ne 1 ] || [ "${#debs[@]}" -ne 1 ] || [ "${#rpms[@]}" -ne 1 ]; then
            echo "Expected exactly one raw AppImage, DEB, and RPM; found ${#appimages[@]}/${#debs[@]}/${#rpms[@]}" >&2
            exit 1
          fi
          case "$(basename "${appimages[0]}")" in *"$APP_VERSION"*) ;; *) echo 'AppImage version drifted' >&2; exit 1;; esac
          file "${appimages[0]}" | grep -Eq '${{ matrix.architecture == 'arm64' && 'ARM aarch64' || 'x86-64' }}' || {
            echo 'AppImage ELF architecture drifted' >&2
            exit 1
          }
          deb_version="$(dpkg-deb -f "${debs[0]}" Version)"
          case "$deb_version" in "$APP_VERSION"|"$APP_VERSION"-*|"$APP_VERSION"+*) ;; *) echo "DEB version drifted: $deb_version" >&2; exit 1;; esac
          [ "$(dpkg-deb -f "${debs[0]}" Architecture)" = '${{ matrix.deb_arch }}' ] || {
            echo 'DEB architecture drifted' >&2
            exit 1
          }
          [ "$(rpm -qp --qf '%{VERSION}' "${rpms[0]}")" = "$APP_VERSION" ] || {
            echo 'RPM version drifted' >&2
            exit 1
          }
          [ "$(rpm -qp --qf '%{ARCH}' "${rpms[0]}")" = '${{ matrix.rpm_arch }}' ] || {
            echo 'RPM architecture drifted' >&2
            exit 1
          }

          mkdir -p release-assets
          cp "${appimages[0]}" "release-assets/FyAgent-${APP_VERSION}-Linux-${{ matrix.asset_arch }}.AppImage"
          cp "${debs[0]}" "release-assets/FyAgent-${APP_VERSION}-Linux-${{ matrix.asset_arch }}.deb"
          cp "${rpms[0]}" "release-assets/FyAgent-${APP_VERSION}-Linux-${{ matrix.asset_arch }}.rpm"
          [ "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 3 ]

      - name: Record Linux build metadata
        shell: bash
        env:
          TARGET_GROUP: ${{ matrix.target_group }}
          TARGET_PLATFORM: linux
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}
          REQUESTED_RUNNER_LABEL: ${{ matrix.runner }}
          ACTUAL_RUNNER_OS: ${{ runner.os }}
          ACTUAL_RUNNER_ARCH: ${{ runner.arch }}
          CONTAINER_IMAGE_REFERENCE: ${{ matrix.container_image }}@${{ matrix.container_digest }}
          CONTAINER_MANIFEST_DIGEST: ${{ matrix.container_digest }}
        run: |
          set -euo pipefail
          source /etc/os-release
          [ "${ACTUAL_RUNNER_OS}" = Linux ] || {
            echo "Runner context OS ${ACTUAL_RUNNER_OS} is not Linux" >&2
            exit 1
          }
          [ "${ACTUAL_RUNNER_ARCH}" = '${{ matrix.expected_runner_arch }}' ] || {
            echo "Runner context architecture ${ACTUAL_RUNNER_ARCH} is not ${{ matrix.expected_runner_arch }}" >&2
            exit 1
          }
          if [ "${ID:-}" != ubuntu ] || [ "${VERSION_ID:-}" != '22.04' ]; then
            echo "Release container is not Ubuntu 22.04 at metadata emission: ${ID:-unknown} ${VERSION_ID:-unknown}" >&2
            exit 1
          fi
          actual_uname_machine="$(uname -m)"
          [ "$actual_uname_machine" = '${{ matrix.uname_arch }}' ] || {
            echo "Container architecture $actual_uname_machine is not native ${{ matrix.uname_arch }} at metadata emission" >&2
            exit 1
          }
          mkdir -p platform-metadata
          ACTUAL_CONTAINER_OS_ID="$ID" \
          ACTUAL_CONTAINER_OS_VERSION_ID="$VERSION_ID" \
          ACTUAL_CONTAINER_UNAME_MACHINE="$actual_uname_machine" \
            node scripts/release/write-platform-metadata.mjs "platform-metadata/${{ matrix.target_group }}.json"

      - name: Upload Linux installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.target_group }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux build metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metadata-${{ matrix.target_group }}
          path: platform-metadata/*
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: macOS Universal ad-hoc app and unsigned DMG
    needs: eligibility
    runs-on: macos-15
    env:
      APP_VERSION: ${{ needs.eligibility.outputs.app_version }}
      RELEASE_TAG: ${{ needs.eligibility.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.eligibility.outputs.source_sha }}
      RELEASE_MODE: ${{ needs.eligibility.outputs.release_mode }}
      EXPECTED_CI_RUN_ID: ${{ needs.eligibility.outputs.ci_run_id }}
      EXPECTED_CI_RUN_ATTEMPT: ${{ needs.eligibility.outputs.ci_run_attempt }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.eligibility.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
          cache: false

      - name: Setup Rust with both universal targets
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.97.1
          target: aarch64-apple-darwin,x86_64-apple-darwin
          cache: false

      - name: Verify frozen source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          pnpm run version:check -- --tag "$RELEASE_TAG"
          node_version="$(node --version)"
          pnpm_version="$(pnpm --version)"
          rust_version="$(rustc --version)"
          [ "$node_version" = 'v24.19.0' ]
          [ "$pnpm_version" = '10.12.3' ]
          case "$rust_version" in 'rustc 1.97.1 '*) ;; *) echo "Rust drift: $rust_version" >&2; exit 1;; esac
          {
            printf 'ACTUAL_NODE_VERSION=%s\n' "$node_version"
            printf 'ACTUAL_PNPM_VERSION=%s\n' "$pnpm_version"
            printf 'ACTUAL_RUST_VERSION=%s\n' "$rust_version"
          } >> "$GITHUB_ENV"

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build universal macOS app
        run: pnpm tauri build --target universal-apple-darwin --bundles app

      - name: Seal and verify ad-hoc app identity without distribution trust
        id: app
        shell: bash
        run: |
          set -euo pipefail
          bundle_root='src-tauri/target/universal-apple-darwin/release/bundle/macos'
          app_count="$(find "$bundle_root" -maxdepth 1 -type d -name 'FyAgent.app' -print | wc -l | tr -d ' ')"
          [ "$app_count" -eq 1 ] || {
            echo "Expected exactly one raw universal FyAgent.app, found $app_count" >&2
            exit 1
          }
          app_path="$(find "$bundle_root" -maxdepth 1 -type d -name 'FyAgent.app' -print | head -1)"
          plist="$app_path/Contents/Info.plist"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          if [ "$bundle_version" != "$APP_VERSION" ] || [ "$bundle_id" != 'com.fyagent.desktop' ]; then
            echo "macOS bundle identity drifted: version=$bundle_version id=$bundle_id" >&2
            exit 1
          fi
          binary="$app_path/Contents/MacOS/$executable"
          archs="$(lipo -archs "$binary")"
          if [[ " $archs " != *' arm64 '* ]] || [[ " $archs " != *' x86_64 '* ]]; then
            echo "FyAgent executable is not universal: $archs" >&2
            exit 1
          fi

          codesign --force --sign - --timestamp=none "$app_path"
          scripts/release/verify-macos-adhoc-app.sh "$app_path"
          printf 'app_path=%s\n' "$app_path" >> "$GITHUB_OUTPUT"
          printf 'executable=%s\n' "$executable" >> "$GITHUB_OUTPUT"

      - name: Create and verify ZIP and unsigned DMG from the same ad-hoc app
        shell: bash
        env:
          APP_PATH: ${{ steps.app.outputs.app_path }}
          APP_EXECUTABLE: ${{ steps.app.outputs.executable }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          zip_path="release-assets/FyAgent-${APP_VERSION}-macOS.zip"
          dmg_path="release-assets/FyAgent-${APP_VERSION}-macOS.dmg"
          stage="$RUNNER_TEMP/fyagent-dmg-stage"
          mount_point="$RUNNER_TEMP/fyagent-dmg-mount"
          unzip_root="$RUNNER_TEMP/fyagent-zip-verify"
          rm -rf "$stage" "$mount_point" "$unzip_root"
          mkdir -p "$stage" "$mount_point" "$unzip_root"
          mounted=false
          cleanup() {
            status=$?
            trap - EXIT
            set +e
            if [ "$mounted" = true ]; then hdiutil detach "$mount_point"; fi
            rm -rf "$stage" "$mount_point" "$unzip_root"
            exit "$status"
          }
          trap cleanup EXIT

          source_digest="$(shasum -a 256 "$APP_PATH/Contents/MacOS/$APP_EXECUTABLE" | awk '{print $1}')"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$zip_path"
          ditto -x -k "$zip_path" "$unzip_root"
          [ -d "$unzip_root/FyAgent.app" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$unzip_root/FyAgent.app/Contents/Info.plist")" = "$APP_VERSION" ]
          [ "$(shasum -a 256 "$unzip_root/FyAgent.app/Contents/MacOS/$APP_EXECUTABLE" | awk '{print $1}')" = "$source_digest" ]
          scripts/release/verify-macos-adhoc-app.sh "$unzip_root/FyAgent.app"

          ditto "$APP_PATH" "$stage/FyAgent.app"
          hdiutil create -volname 'FyAgent' -srcfolder "$stage" -ov -format UDZO "$dmg_path"
          hdiutil verify "$dmg_path"
          mounted=true
          hdiutil attach "$dmg_path" -readonly -nobrowse -noautoopen -mountpoint "$mount_point"
          [ -d "$mount_point/FyAgent.app" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$mount_point/FyAgent.app/Contents/Info.plist")" = "$APP_VERSION" ]
          [ "$(shasum -a 256 "$mount_point/FyAgent.app/Contents/MacOS/$APP_EXECUTABLE" | awk '{print $1}')" = "$source_digest" ]
          scripts/release/verify-macos-adhoc-app.sh "$mount_point/FyAgent.app"
          hdiutil detach "$mount_point"
          mounted=false
          if xcrun stapler validate "$dmg_path" >/dev/null 2>&1; then
            echo "Unsigned $RELEASE_TAG DMG unexpectedly contains a notarization ticket" >&2
            exit 1
          fi
          if dmg_signature="$(codesign -dvvv "$dmg_path" 2>&1)"; then
            echo "Unsigned $RELEASE_TAG DMG unexpectedly has a code signature" >&2
            exit 1
          fi
          grep -Fq 'code object is not signed at all' <<<"$dmg_signature" || {
            echo "Unable to prove that the $RELEASE_TAG DMG is unsigned: $dmg_signature" >&2
            exit 1
          }
          if grep -Eqi '^Signature=|^Authority=|Developer ID|^TeamIdentifier=|^Timestamp=|^CMSDigest' <<<"$dmg_signature"; then
            echo "Unsigned $RELEASE_TAG DMG produced contradictory signature evidence" >&2
            exit 1
          fi
          [ "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 2 ]

      - name: Record macOS build metadata
        env:
          TARGET_GROUP: macos-universal
          TARGET_PLATFORM: macos
          TARGET_ARCHITECTURE: universal
          REQUESTED_RUNNER_LABEL: macos-15
          ACTUAL_RUNNER_OS: ${{ runner.os }}
          ACTUAL_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          mkdir -p platform-metadata
          node scripts/release/write-platform-metadata.mjs platform-metadata/macos-universal.json

      - name: Upload macOS installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-macos-universal
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS build metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metadata-macos-universal
          path: platform-metadata/*
          if-no-files-found: error
          retention-days: 7

  pin-release-build-inputs:
    name: Pin immutable pre-signer build inputs
    needs: [eligibility, build-windows, build-linux, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      APP_VERSION: ${{ needs.eligibility.outputs.app_version }}
      SOURCE_SHA: ${{ needs.eligibility.outputs.source_sha }}
    steps:
      - name: Checkout immutable build-input pinning boundary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.eligibility.outputs.source_sha }}

      - name: Setup exact pinning Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Verify immutable pinning checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(node --version)" = "v$(tr -d '\r\n' < .node-version)"

      - name: Download exact unsigned Windows build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: raw-windows-*
          path: release-build-inputs

      - name: Download exact non-Windows installer build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: release-build-inputs

      - name: Download exact platform metadata build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: metadata-*
          path: release-build-inputs

      - name: Create exact trusted build input bundle
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/pin-release-build-inputs.mjs create \
            release-build-inputs trusted-build-inputs "$APP_VERSION" "$SOURCE_SHA"

      - name: Upload immutable trusted build inputs
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-build-inputs
          path: trusted-build-inputs/*
          if-no-files-found: error
          retention-days: 7

  verify-assets:
    name: Verify exact installers and generate evidence
    if: ${{ always() && needs.eligibility.result == 'success' && needs['build-windows'].result == 'success' && needs['build-linux'].result == 'success' && needs['build-macos'].result == 'success' && needs['pin-release-build-inputs'].result == 'success' && ((github.event_name == 'workflow_dispatch' && needs.eligibility.outputs.release_mode == 'preflight' && needs['prove-windows-preflight'].result == 'success' && needs['sign-windows-formal'].result == 'skipped' && needs['seal-windows-formal'].result == 'skipped') || (github.event_name == 'push' && needs.eligibility.outputs.release_mode == 'formal' && needs['prove-windows-preflight'].result == 'skipped' && needs['sign-windows-formal'].result == 'success' && needs['seal-windows-formal'].result == 'success')) }}
    needs:
      [
        eligibility,
        build-windows,
        build-linux,
        build-macos,
        pin-release-build-inputs,
        prove-windows-preflight,
        sign-windows-formal,
        seal-windows-formal,
      ]
    runs-on: ubuntu-24.04
    env:
      APP_VERSION: ${{ needs.eligibility.outputs.app_version }}
      RELEASE_TAG: ${{ needs.eligibility.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.eligibility.outputs.source_sha }}
      TRUSTED_WORKFLOW_SHA: ${{ needs.eligibility.outputs.workflow_sha }}
      RELEASE_MODE: ${{ needs.eligibility.outputs.release_mode }}
      GENERATED_AT: ${{ needs.eligibility.outputs.generated_at }}
      EXPECTED_CI_RUN_ID: ${{ needs.eligibility.outputs.ci_run_id }}
      EXPECTED_CI_RUN_ATTEMPT: ${{ needs.eligibility.outputs.ci_run_attempt }}
    steps:
      - name: Checkout evidence generators
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.eligibility.outputs.workflow_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download immutable pre-signer build inputs by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs['pin-release-build-inputs'].outputs.artifact_id }}
          path: trusted-build-inputs

      - name: Verify and stage immutable pre-signer build inputs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/pin-release-build-inputs.mjs verify \
            trusted-build-inputs "$APP_VERSION" "$SOURCE_SHA"
          mkdir downloaded-installers downloaded-metadata
          cp -R trusted-build-inputs/installers-* downloaded-installers/
          cp -R trusted-build-inputs/metadata-* downloaded-metadata/

      - name: Download sealed Windows installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-windows-*
          path: downloaded-installers

      - name: Download private Windows signing fragments
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: signing-*
          path: downloaded-signing

      - name: Verify exact ten and generate three machine-readable subjects
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/collect-workflow-artifacts.mjs \
            installers downloaded-installers installers "$APP_VERSION"
          node scripts/release/collect-workflow-artifacts.mjs \
            metadata downloaded-metadata platform-metadata "$APP_VERSION"
          node scripts/release/collect-workflow-artifacts.mjs \
            signing downloaded-signing signing-fragments "$APP_VERSION"
          node scripts/release/verify-release-files.mjs installers installers "$APP_VERSION"
          mkdir verified-subjects
          cp installers/* verified-subjects/
          node scripts/release/windows-signing.mjs aggregate \
            --x64-status signing-fragments/windows-signing-x64.json \
            --arm64-status signing-fragments/windows-signing-arm64.json \
            --assets-directory installers \
            --version "$APP_VERSION" \
            --source-sha "$SOURCE_SHA" \
            --output verified-subjects/signing-status.json
          node scripts/generate-download-manifest.mjs \
            installers "$APP_VERSION" "$RELEASE_TAG" "$SOURCE_SHA" \
            'https://github.com/NongHua123/fyagent/releases/download' "$GENERATED_AT" \
            verified-subjects/download-manifest.json
          node scripts/release/generate-build-metadata.mjs \
            platform-metadata "$APP_VERSION" "$RELEASE_TAG" "$SOURCE_SHA" \
            "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY_ID" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$GITHUB_EVENT_NAME" "$RELEASE_MODE" "$GITHUB_WORKFLOW_REF" \
            "$TRUSTED_WORKFLOW_SHA" \
            "$EXPECTED_CI_RUN_ID" "$EXPECTED_CI_RUN_ATTEMPT" "$GENERATED_AT" \
            verified-subjects/build-metadata.json
          node scripts/release/verify-release-files.mjs subjects verified-subjects "$APP_VERSION"

      - name: Upload the exact thirteen attestation subjects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-attestation-subjects
          path: verified-subjects/*
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest ten installers and three evidence files
    needs: [eligibility, verify-assets]
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      APP_VERSION: ${{ needs.eligibility.outputs.app_version }}
    steps:
      - name: Checkout release contract verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.eligibility.outputs.workflow_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download verified subjects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-attestation-subjects
          path: verified-subjects

      - name: Recheck the exact thirteen subjects
        run: node scripts/release/verify-release-files.mjs subjects verified-subjects "$APP_VERSION"

      - name: Generate mandatory GitHub artifact attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: verified-subjects/*

      - name: Assemble and verify exact fourteen Release attachments
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          [ -s "$BUNDLE_PATH" ] || {
            echo 'actions/attest did not return a non-empty Sigstore bundle' >&2
            exit 1
          }
          mkdir release-attachments
          cp verified-subjects/* release-attachments/
          cp "$BUNDLE_PATH" release-attachments/artifact-attestation.sigstore.json
          node scripts/release/verify-release-files.mjs attachments release-attachments "$APP_VERSION"

      - name: Upload exact Release transaction payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-attachments
          path: release-attachments/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish stable GitHub Release
    if: github.event_name == 'push' && needs.eligibility.outputs.release_mode == 'formal'
    needs: [eligibility, attest]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: read
      contents: write
    env:
      APP_VERSION: ${{ needs.eligibility.outputs.app_version }}
      RELEASE_APP_VERSION: ${{ needs.eligibility.outputs.app_version }}
      RELEASE_TAG: ${{ needs.eligibility.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.eligibility.outputs.source_sha }}
      RELEASE_SOURCE_SHA: ${{ needs.eligibility.outputs.source_sha }}
      TRUSTED_WORKFLOW_SHA: ${{ needs.eligibility.outputs.workflow_sha }}
      EXPECTED_CI_RUN_ID: ${{ needs.eligibility.outputs.ci_run_id }}
      EXPECTED_CI_RUN_ATTEMPT: ${{ needs.eligibility.outputs.ci_run_attempt }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout immutable formal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.eligibility.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Revalidate frozen dev release eligibility at publish start
        shell: bash
        env:
          RELEASE_APP_VERSION: ${{ needs.eligibility.outputs.app_version }}
          RELEASE_SOURCE_SHA: ${{ needs.eligibility.outputs.source_sha }}
        run: |
          set -euo pipefail
          frozen_eligibility="$RUNNER_TEMP/fyagent-frozen-release-eligibility.json"
          jq -n \
            --arg appVersion "$APP_VERSION" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg workflowSha "$TRUSTED_WORKFLOW_SHA" \
            --arg ciRunId "$EXPECTED_CI_RUN_ID" \
            --arg ciRunAttempt "$EXPECTED_CI_RUN_ATTEMPT" \
            '{appVersion:$appVersion,releaseTag:$releaseTag,sourceSha:$sourceSha,
              workflowSha:$workflowSha,ciRunId:$ciRunId,
              ciRunAttempt:$ciRunAttempt,mode:"formal"}' \
            > "$frozen_eligibility"
          node scripts/release/verify-dev-release-remote.mjs \
            --json \
            --evidence "$RUNNER_TEMP/fyagent-publish-start-remote-evidence.json" \
            --expected "$frozen_eligibility" \
            > "$RUNNER_TEMP/fyagent-publish-start-eligibility.json"

      - name: Download complete Release transaction payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-attachments
          path: release-attachments

      - name: Fail closed before the one-time publish
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = "refs/tags/$RELEASE_TAG" ]
          [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" = "$RELEASE_TAG" ]
          [ "$GITHUB_WORKFLOW_REF" = "NongHua123/fyagent/.github/workflows/release.yml@refs/tags/$RELEASE_TAG" ]
          [ "$GITHUB_WORKFLOW_SHA" = "$SOURCE_SHA" ] && [ "$TRUSTED_WORKFLOW_SHA" = "$SOURCE_SHA" ]
          [ "$RELEASE_TAG" = "v$APP_VERSION" ]
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$SOURCE_SHA" ]
          node scripts/release/verify-release-files.mjs attachments release-attachments "$APP_VERSION"
          jq -e --arg version "$APP_VERSION" --arg source "$SOURCE_SHA" '
            .schema == "fyagent-windows-signing-status/v1" and
            .product == "FyAgent" and .version == $version and .sourceSha == $source and
            (.mode == "signed" or .mode == "unsigned") and
            ([.assets[].architecture] | sort) == ["arm64", "x64"] and
            ([.assets[].name] | sort) == ([
              "FyAgent-" + $version + "-Windows-arm64-setup.exe",
              "FyAgent-" + $version + "-Windows-x64-setup.exe"
            ] | sort)
          ' release-attachments/signing-status.json >/dev/null
          release_notes_path="docs/release-notes/${RELEASE_TAG}-en.md"
          [ -s "$release_notes_path" ] || {
            echo "English $RELEASE_TAG Release Notes are missing" >&2
            exit 1
          }

      - name: Stage, re-download, and publish one stable Release transaction
        shell: bash
        run: |
          set -euo pipefail
          repository='NongHua123/fyagent'
          api_root='https://api.github.com'
          uploads_root='https://uploads.github.com'
          transaction_root="$(mktemp -d "$RUNNER_TEMP/fyagent-release-transaction.XXXXXX")"
          draft_created=false
          publish_attempted=false
          draft_id=''
          draft_url=''
          report_failure() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ] && [ "$draft_created" = true ]; then
              observed_state='unknown'
              observed_json="$transaction_root/failure-release-state.json"
              if observed_status="$(curl --silent --show-error \
                --output "$observed_json" --write-out '%{http_code}' \
                "${api_headers[@]}" "$api_root/repos/$repository/releases/$draft_id")" &&
                [ "$observed_status" = 200 ] &&
                jq -e --argjson id "$draft_id" --arg tag "$RELEASE_TAG" \
                  '.id == $id and .tag_name == $tag and (.draft | type) == "boolean"' \
                  "$observed_json" >/dev/null; then
                observed_state="$(jq -r 'if .draft then "draft" else "published" end' "$observed_json")"
              fi
              echo "Release transaction failed after creating id=$draft_id url=$draft_url; publish_attempted=$publish_attempted; observed_state=$observed_state" >&2
              case "$observed_state" in
                draft)
                  echo 'The API re-read shows that the Release remains a draft. The workflow leaves it untouched; inspect it and make a separate manual cleanup decision before retrying.' >&2
                  ;;
                published)
                  echo 'The API re-read shows that the Release is published. Do not retry, patch, delete, or move the tag; perform an independent release verification and decision.' >&2
                  ;;
                *)
                  echo 'The publish outcome is unknown. Do not retry, patch, delete, or move the tag until an operator has inspected the Release by ID.' >&2
                  ;;
              esac
            fi
            rm -rf "$transaction_root"
            exit "$status"
          }
          trap report_failure EXIT

          api_headers=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          existing_json="$transaction_root/existing.json"
          printf '[]\n' > "$existing_json"
          page=1
          while :; do
            page_json="$transaction_root/existing-page-$page.json"
            page_headers="$transaction_root/existing-page-$page.headers"
            page_status="$(curl --silent --show-error \
              --dump-header "$page_headers" \
              --output "$page_json" --write-out '%{http_code}' \
              "${api_headers[@]}" \
              "$api_root/repos/$repository/releases?per_page=100&page=$page")"
            if [ "$page_status" != 200 ] || ! jq -e 'type == "array"' "$page_json" >/dev/null; then
              echo "Cannot enumerate Release inventory page $page (HTTP $page_status)" >&2
              exit 1
            fi
            jq -s '.[0] + .[1]' "$existing_json" "$page_json" \
              > "$transaction_root/existing-next.json"
            mv "$transaction_root/existing-next.json" "$existing_json"
            if ! grep -Eqi '^link:.*rel="next"' "$page_headers"; then
              break
            fi
            page=$((page + 1))
            [ "$page" -le 1000 ] || {
              echo 'Release inventory pagination exceeded the fail-closed safety bound' >&2
              exit 1
            }
          done
          [ "$(jq --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)] | length' "$existing_json")" -eq 0 ] || {
            echo "A draft or published Release already exists for $RELEASE_TAG; refusing to update, replace, or delete it" >&2
            exit 1
          }

          transaction_marker="fyagent-release-transaction:run=$GITHUB_RUN_ID;attempt=$GITHUB_RUN_ATTEMPT;source=$SOURCE_SHA"
          signing_disclosure="$(jq -r '
            [
              "## Windows installer signing status",
              "",
              ("Mode: `" + .mode + "`; source: `" + .sourceSha + "`. The installer rows below are backed by the published `signing-status.json` and `artifact-attestation.sigstore.json` evidence."),
              "",
              "| Architecture | Installer | Authenticode | Publisher | Timestamp | SHA-256 | Source SHA | Attestation |",
              "| --- | --- | --- | --- | --- | --- | --- | --- |"
            ] +
            (.assets
              | sort_by(if .architecture == "x64" then 0 else 1 end)
              | map(
                  "| " + .architecture +
                  " | `" + .name +
                  "` | `" + .signature.status +
                  "` | " + ((.signature.publisher // "Not signed") | gsub("[|\\r\\n]"; " ")) +
                  " | " + (if .signature.timestampCertificate == null then "None" else "Verified" end) +
                  " | `" + .sha256 +
                  "` | `" + .sourceSha +
                  "` | `" + .attestation.bundle +
                  "` subject `" + .attestation.subjectName +
                  "` digest `" + .attestation.subjectDigest + "` |"
                ))
            | join("\n")
          ' release-attachments/signing-status.json)"
          release_notes_path="docs/release-notes/${RELEASE_TAG}-en.md"
          notes="$(cat "$release_notes_path")"
          notes="${notes}"$'\n\n'"${signing_disclosure}"
          draft_body="${notes}"$'\n\n'"<!-- ${transaction_marker} -->"
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg source "$SOURCE_SHA" \
            --arg name "FyAgent $RELEASE_TAG" \
            --arg body "$draft_body" \
            '{tag_name:$tag,target_commitish:$source,name:$name,body:$body,draft:true,prerelease:false,generate_release_notes:false}' \
            > "$transaction_root/create.json"
          create_json="$transaction_root/created.json"
          create_status="$(curl --silent --show-error \
            --request POST --output "$create_json" --write-out '%{http_code}' \
            "${api_headers[@]}" -H 'Content-Type: application/json' \
            --data-binary @"$transaction_root/create.json" \
            "$api_root/repos/$repository/releases")"
          [ "$create_status" = 201 ] || {
            echo "Draft creation failed with HTTP $create_status" >&2
            exit 1
          }
          draft_id="$(jq -r '.id' "$create_json")"
          draft_url="$(jq -r '.html_url' "$create_json")"
          [[ "$draft_id" =~ ^[1-9][0-9]*$ ]]
          draft_created=true
          jq -e \
            --argjson id "$draft_id" \
            --arg tag "$RELEASE_TAG" \
            --arg marker "$transaction_marker" \
            --arg uploads "$uploads_root/repos/$repository/releases/$draft_id/assets{?name,label}" \
            '.id == $id and .draft == true and .prerelease == false and
             .tag_name == $tag and
             (.body | contains($marker)) and .upload_url == $uploads and
             (.assets | length) == 0' \
            "$create_json" >/dev/null

          upload_base="$uploads_root/repos/$repository/releases/$draft_id/assets"
          while IFS= read -r asset_path; do
            asset_name="$(basename "$asset_path")"
            [[ "$asset_name" =~ ^[A-Za-z0-9._-]+$ ]]
            upload_json="$transaction_root/upload-$asset_name.json"
            upload_status="$(curl --silent --show-error \
              --request POST --output "$upload_json" --write-out '%{http_code}' \
              "${api_headers[@]}" -H 'Content-Type: application/octet-stream' \
              --data-binary @"$asset_path" \
              "$upload_base?name=$asset_name")"
            [ "$upload_status" = 201 ] || {
              echo "Upload failed for $asset_name with HTTP $upload_status" >&2
              exit 1
            }
            jq -e \
              --arg name "$asset_name" \
              --argjson size "$(stat -c '%s' "$asset_path")" \
              '.name == $name and .state == "uploaded" and .size == $size and (.id | type) == "number"' \
              "$upload_json" >/dev/null
          done < <(find release-attachments -maxdepth 1 -type f -print | LC_ALL=C sort)

          assets_json="$transaction_root/assets.json"
          assets_status="$(curl --silent --show-error \
            --output "$assets_json" --write-out '%{http_code}' \
            "${api_headers[@]}" \
            "$api_root/repos/$repository/releases/$draft_id/assets?per_page=100")"
          [ "$assets_status" = 200 ]
          jq -e '
            length == 14 and
            (map(.id) | unique | length) == 14 and
            (map(.name) | unique | length) == 14 and
            all(.state == "uploaded" and .size > 0)
          ' "$assets_json" >/dev/null

          remote_root="$transaction_root/remote-release-attachments"
          mkdir "$remote_root"
          while IFS=$'\t' read -r asset_id asset_name; do
            [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$asset_name" =~ ^[A-Za-z0-9._-]+$ ]]
            download_status="$(curl --silent --show-error --location \
              --output "$remote_root/$asset_name" --write-out '%{http_code}' \
              "${api_headers[@]}" -H 'Accept: application/octet-stream' \
              "$api_root/repos/$repository/releases/assets/$asset_id")"
            [ "$download_status" = 200 ] || {
              echo "Re-download failed for $asset_name with HTTP $download_status" >&2
              exit 1
            }
            local_digest="$(sha256sum "release-attachments/$asset_name" | cut -d' ' -f1)"
            remote_digest="$(sha256sum "$remote_root/$asset_name" | cut -d' ' -f1)"
            [ "$local_digest" = "$remote_digest" ] || {
              echo "Re-downloaded bytes differ for $asset_name" >&2
              exit 1
            }
          done < <(jq -r '.[] | [.id, .name] | @tsv' "$assets_json")
          node scripts/release/verify-release-files.mjs attachments "$remote_root" "$APP_VERSION"

          prepublish_json="$transaction_root/prepublish.json"
          prepublish_status="$(curl --silent --show-error \
            --output "$prepublish_json" --write-out '%{http_code}' \
            "${api_headers[@]}" "$api_root/repos/$repository/releases/$draft_id")"
          [ "$prepublish_status" = 200 ] || {
            echo "Cannot re-read the private draft immediately before publish (HTTP $prepublish_status)" >&2
            exit 1
          }
          jq -e \
            --argjson id "$draft_id" \
            --arg tag "$RELEASE_TAG" \
            --arg marker "$transaction_marker" \
            --slurpfile expected "$assets_json" \
            '.id == $id and .draft == true and .prerelease == false and
             .tag_name == $tag and (.body | contains($marker)) and
             ((.assets | map({id,name,size,state}) | sort_by(.id)) ==
              ($expected[0] | map({id,name,size,state}) | sort_by(.id)))' \
            "$prepublish_json" >/dev/null

          jq -n \
            --arg name "FyAgent $RELEASE_TAG" \
            --arg body "$notes" \
            '{name:$name,body:$body,draft:false,prerelease:false,make_latest:"true"}' \
            > "$transaction_root/publish.json"
          published_json="$transaction_root/published.json"
          node scripts/release/verify-dev-release-remote.mjs \
            --json \
            --evidence "$transaction_root/final-remote-evidence.json" \
            --expected "$RUNNER_TEMP/fyagent-frozen-release-eligibility.json" \
            > "$transaction_root/final-release-eligibility.json"
          publish_attempted=true
          publish_status="$(curl --silent --show-error \
            --request PATCH --output "$published_json" --write-out '%{http_code}' \
            "${api_headers[@]}" -H 'Content-Type: application/json' \
            --data-binary @"$transaction_root/publish.json" \
            "$api_root/repos/$repository/releases/$draft_id")"
          [ "$publish_status" = 200 ] || {
            echo "Final publish failed with HTTP $publish_status" >&2
            exit 1
          }
          jq -e \
            --argjson id "$draft_id" \
            --arg tag "$RELEASE_TAG" \
            --arg body "$notes" \
            '.id == $id and .draft == false and .prerelease == false and
             .tag_name == $tag and
             .name == ("FyAgent " + $tag) and .body == $body and
             (.published_at | type) == "string" and (.assets | length) == 14' \
            "$published_json" >/dev/null

          published_confirm_json="$transaction_root/published-confirmed.json"
          published_confirm_status="$(curl --silent --show-error \
            --output "$published_confirm_json" --write-out '%{http_code}' \
            "${api_headers[@]}" "$api_root/repos/$repository/releases/$draft_id")"
          [ "$published_confirm_status" = 200 ] || {
            echo "Cannot confirm the published Release by ID (HTTP $published_confirm_status)" >&2
            exit 1
          }
          jq -e \
            --argjson id "$draft_id" \
            --arg tag "$RELEASE_TAG" \
            --arg body "$notes" \
            --slurpfile expected "$assets_json" \
            '.id == $id and .draft == false and .prerelease == false and
             .tag_name == $tag and .name == ("FyAgent " + $tag) and
             .body == $body and (.published_at | type) == "string" and
             ((.assets | map({id,name,size,state}) | sort_by(.id)) ==
              ($expected[0] | map({id,name,size,state}) | sort_by(.id)))' \
            "$published_confirm_json" >/dev/null

          latest_json="$transaction_root/latest.json"
          latest_status="$(curl --silent --show-error \
            --output "$latest_json" --write-out '%{http_code}' \
            "${api_headers[@]}" "$api_root/repos/$repository/releases/latest")"
          [ "$latest_status" = 200 ]
          jq -e --argjson id "$draft_id" '.id == $id and .draft == false and .prerelease == false' \
            "$latest_json" >/dev/null
          draft_created=false
          publish_attempted=false
