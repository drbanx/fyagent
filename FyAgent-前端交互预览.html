    <title>FyAgent</title>

    <style data-fyagent-inline-entry="stylesheet">.fy-agent-layout{display:grid;grid-template-columns:minmax(220px,.72fr) minmax(0,1.7fr);gap:14px;min-width:0}.fy-agent-catalog,.fy-agent-detail{min-width:0}.fy-agent-catalog-heading{display:grid;gap:4px}.fy-agent-catalog-heading span{color:var(--fy-text-secondary);font-size:12px}.fy-agent-selector{display:grid;gap:7px;margin-top:14px}.fy-agent-selector-item{display:grid;grid-template-columns:36px minmax(0,1fr);align-items:center;gap:10px;width:100%;min-width:0;min-height:58px;padding:9px 11px;border:1px solid transparent;border-radius:11px;color:var(--fy-text);text-align:left;background:transparent;cursor:pointer;transition:border-color .13s ease-out,background-color .13s ease-out,transform .13s ease-out}.fy-agent-selector-item:hover:not(:disabled){background:#e5f6ff1a}.fy-agent-selector-item:active:not(:disabled){transform:translateY(1px)}.fy-agent-selector-item[aria-current=true]{border-color:var(--fy-selected-border);background:var(--fy-selected)}.fy-agent-selector-item:disabled{cursor:not-allowed;opacity:.58}.fy-agent-selector-icon,.fy-agent-detail-icon{display:block;-o-object-fit:contain;object-fit:contain}.fy-agent-selector-icon{width:34px;height:34px;padding:3px;border-radius:9px;background:#eef9ffdb}.fy-agent-selector-copy{display:grid;gap:3px;min-width:0}.fy-agent-selector-copy strong,.fy-agent-selector-copy span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fy-agent-selector-copy span{color:var(--fy-text-secondary);font-size:11px}.fy-agent-selector-state{color:var(--fy-text-tertiary);font-size:10px}.fy-agent-detail{display:grid;align-content:start;gap:17px}.fy-agent-identity{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;gap:14px}.fy-agent-detail-icon{width:62px;height:62px;padding:6px;border:1px solid var(--fy-border);border-radius:16px;background:#eef9ffe6;box-shadow:inset 0 1px #ffffff52}.fy-agent-detail-icon-native-size{width:48px;height:48px;margin:7px}.fy-agent-identity-copy{display:grid;gap:7px;min-width:0}.fy-agent-identity-title{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.fy-agent-identity-title h2{margin:0;font-size:21px;letter-spacing:-.02em}.fy-agent-section{display:grid;gap:11px;min-width:0}.fy-agent-section h3{margin:0;font-size:14px}.fy-agent-capabilities{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.fy-agent-capability{display:grid;align-content:start;gap:7px;min-width:0;padding:11px 12px;border:1px solid var(--fy-border);border-radius:11px;background:#e2f3ff0d}.fy-agent-capability-header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:7px}.fy-agent-capability-header strong{font-size:12px}.fy-agent-capability p{margin:0;color:var(--fy-text-secondary);font-size:11px;line-height:1.55;overflow-wrap:anywhere}.fy-agent-observation{display:grid;gap:10px;padding:12px;border:1px solid var(--fy-border);border-radius:12px;background:#e2f3ff0f}.fy-agent-observation-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0}.fy-agent-observation-grid div{display:grid;gap:3px;min-width:0;padding:9px 10px;border-radius:9px;background:#091d3029}.fy-agent-observation-grid dt{color:var(--fy-text-secondary);font-size:11px}.fy-agent-observation-grid dd{min-width:0;margin:0;font-size:13px;font-weight:650;overflow-wrap:anywhere}.fy-agent-observation-loading{display:flex;align-items:center;gap:9px;min-height:42px;color:var(--fy-text-secondary);font-size:12px}.fy-agent-observation-error{display:grid;gap:9px}.fy-agent-observation-error p{margin:0;color:var(--fy-text-secondary);font-size:12px;line-height:1.55}.fy-agent-action-row{display:flex;flex-wrap:wrap;gap:8px}.fy-agent-evidence{margin:0;padding-top:12px;border-top:1px solid var(--fy-border);color:var(--fy-text-secondary);font-size:11px;line-height:1.55;overflow-wrap:anywhere}@media(max-width:760px){.fy-agent-layout{grid-template-columns:minmax(0,1fr)}.fy-agent-selector{grid-template-columns:repe - 默认使用简体中文；技术名词、命令和代码标识在更准确时保留英文。
- 先给结论和下一步，再补充必要依据。
- 需要提问时一次问清会改变方案的关键问题，避免多轮追问。`,enabled:!0,kind:"builtin",category:"角色与表达",origin:"本机规则提炼",targetIds:Vo(ul),updatedAt:"本机扫描 · 08-12"},{id:"goal-boundary-evidence",name:"目标、边界与完成证据",description:"先确认要做什么，再用真实结果收口",content:`# 任务闭环

- 开始前确认目标、范围、依赖和验收条件。
- 优先读取项目已有规则与真实代码，不凭空补全关键事实。
- 声称完成前运行与风险相称的验证，并说明本轮真实结果。`,enabled:!0,kind:"builtin",category:"验收规则",origin:"本机规则提炼",targetIds:Vo(ul),updatedAt:"本机扫描 · 08-12"},{id:"context-first",name:"先读项目上下文",description:"按全局与项目层级加载规则",content:`# 上下文加载

- 会话开始时先读取当前目录与上级目录生效的指导文件。
- 项目规则优先于通用习惯；发现冲突时说明采用了哪一层。
- 只加载当前任务需要的规则、记忆和工具说明。`,enabled:!1,kind:"builtin",category:"通用规则",origin:"本机规则提炼",targetIds:Vo(ul),updatedAt:"本机扫描 · 08-12"},{id:"planning-design",name:"规划与方案对比",description:"先搭框架，比较方案后再执行",content:`# 规划与设计

- 先明确用户问题、使用场景和成功标准。
- 对非显然选择至少比较可行方案、代价与风险。
- 计划必须写出外部依赖、关键分岔和可验证的下一步。`,enabled:!1,kind:"builtin",category:"执行流程",origin:"本机规则提炼",targetIds:["claude-global","codex-global"],updatedAt:"本机扫描 · 08-12"},{id:"implementation-discipline",name:"最小改动与真实验证",description:"遵循现有架构，只改完成任务所需内容",content:`# 代码实现

- 修改前搜索已有实现、类型、测试和约定，优先复用。
- 做最小且完整的改动，保护与任务无关的现有内容。
- 先运行最接近改动的检查，再覆盖受影响范围。`,enabled:!1,kind:"builtin",category:"执行流程",origin:"本机规则提炼",targetIds:Vo(ag),updatedAt:"本机扫描 · 08-12"},{id:"code-review",name:"代码审查",description:"优先发现正确性、回归与数据风险",content:`# 代码审查

- 优先检查正确性、数据丢失、竞态、兼容性和回归风险。
- 只报告能够从代码或运行结果证明的问题。
- 每个问题说明影响、触发条件、准确位置和修复方向。`,enabled:!1,kind:"builtin",category:"验收规则",origin:"官方基础模板",targetIds:Vo(ag),updatedAt:"内置 v1"},{id:"memory-continuity",name:"记忆读取与写回",description:"先读稳定记忆，重要变化及时记录",content:`# 记忆连续性

- 行动前读取与当前任务相关的用户偏好、决策和历史教训。
- 重要决定、重复失败模式或用户明确要求记住的内容，写入对应的长期记忆。
- 每日记录、会话原文和长期结论分开保存，不用原始聊天替代结论。`,enabled:!1,kind:"builtin",category:"记忆规则",origin:"本机规则提炼",targetIds:Vo(DR),updatedAt:"本机扫描 · 08-12"},{id:"tool-troubleshooting",name:"工具失败先定位根因",description:"保留错误证据，逐层确认真实阻塞",content:`# 工具与故障

- 先保留准确错误、输入与环境，再判断是配置、权限、网络还是运行时问题。
- 不用重复重试代替诊断；每次尝试都应验证一个明确假设。
- 修复后重跑原失败路径，并记录可复用的预防方法。`,enabled:!1,kind:"builtin",category:"执行流程",origin:"本机规则提炼",targetIds:Vo(ul),updatedAt:"本机扫描 · 08-12"},{id:"heartbeat-boundary",name:"定时任务与心跳边界",description:"只在有变化或到期时主动运行",content:`# 定时与心跳
